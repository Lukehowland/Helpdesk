# =============================================================================
# HELPDESK SYSTEM - Docker Compose (Academy Deployment Format)
# =============================================================================

services:
    # ---------------------------------------------------------------------------
    # Laravel Application (PHP-FPM)
    # ---------------------------------------------------------------------------
    laravel:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: helpdesk-laravel
        volumes:
            - .:/var/www
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: helpdesk_db
            DB_USERNAME: admin
            DB_PASSWORD: admin123
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_DRIVER: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
        depends_on:
            - db
            - redis
        networks:
            - helpdesk-net

    # ---------------------------------------------------------------------------
    # Nginx Web Server
    # ---------------------------------------------------------------------------
    nginx:
        image: nginx:latest
        container_name: helpdesk
        expose:
            - "80"
        # ports:
        #   - "8080:80"  # Descomentar para pruebas locales
        volumes:
            - .:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - laravel
        networks:
            - helpdesk-net
            - internal-network
            - proxy-network

    # ---------------------------------------------------------------------------
    # PostgreSQL Database
    # ---------------------------------------------------------------------------
    db:
        image: postgres:latest
        container_name: helpdesk-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: helpdesk_db
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin123
        volumes:
            - db-data:/var/lib/postgresql
        networks:
            - helpdesk-net

    # ---------------------------------------------------------------------------
    # Redis Cache & Queue
    # ---------------------------------------------------------------------------
    redis:
        image: redis:alpine
        container_name: helpdesk-redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        networks:
            - helpdesk-net

    # ---------------------------------------------------------------------------
    # Queue Worker (Laravel Jobs - Emails, Scheduled Announcements)
    # ---------------------------------------------------------------------------
    queue:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: helpdesk-queue
        restart: unless-stopped
        volumes:
            - .:/var/www
        environment:
            APP_ENV: production
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: helpdesk_db
            DB_USERNAME: admin
            DB_PASSWORD: admin123
            REDIS_HOST: redis
            CACHE_DRIVER: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
        depends_on:
            - db
            - redis
            - laravel
        command: php artisan queue:work redis --queue=emails,default --tries=3 --timeout=90
        networks:
            - helpdesk-net

# =============================================================================
# Networks
# =============================================================================
networks:
    helpdesk-net:
        driver: bridge
    internal-network:
        external: true
    proxy-network:
        external: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
    db-data:
    redis-data:
